name: Samples

# Builds sample integrations from the samples/ folder (everything except cuda-samples,
# which is already exercised in ci.yml). Manual trigger only, since these are heavier
# CUDA-enabled builds (libtorch, onnxruntime) not otherwise covered by CI.
on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Which sample recipe to build
        type: choice
        options:
          - all
          - libtorch
          - onnxruntime
          - llama-cpp
        default: all

jobs:
  libtorch:
    if: github.event.inputs.recipe == 'all' || github.event.inputs.recipe == 'libtorch'
    name: libtorch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          profile_detect: false

      - name: Autodetect conan profile
        run: conan profile detect --name autodetected

      - name: Install Conan profile config
        run: conan config install .github/conan-config -t dir

      - name: Add cuda-conan local recipes index remote
        run: conan remote add cuda-conan ./ --index=0 -t local-recipes-index

      - name: conan create libtorch
        run: conan create samples/libtorch/all --version 2.9.1 --build=missing

  onnxruntime:
    if: github.event.inputs.recipe == 'all' || github.event.inputs.recipe == 'onnxruntime'
    name: onnxruntime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          profile_detect: false

      - name: Autodetect conan profile
        run: conan profile detect --name autodetected

      - name: Install Conan profile config
        run: conan config install .github/conan-config -t dir

      - name: Add cuda-conan local recipes index remote
        run: conan remote add cuda-conan ./ --index=0 -t local-recipes-index

      - name: conan create onnxruntime
        run: conan create samples/onnxruntime/all --version 1.24.4 --build=missing

  llama-cpp:
    if: github.event.inputs.recipe == 'all' || github.event.inputs.recipe == 'llama-cpp'
    name: llama-cpp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          profile_detect: false

      - name: Autodetect conan profile
        run: conan profile detect --name autodetected

      - name: Install Conan profile config
        run: conan config install .github/conan-config -t dir

      - name: Add cuda-conan local recipes index remote
        run: conan remote add cuda-conan ./ --index=0 -t local-recipes-index

      - name: conan create llama-cpp
        run: conan create samples/llama-cpp/all --version=b6565 --build=missing
