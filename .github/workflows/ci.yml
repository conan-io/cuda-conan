name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  create-recipes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        cuda-version: ["12.9", "13.0", "13.2"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Conan
        uses: conan-io/setup-conan@v1

      - name: conan create
        run: conan create recipes/cuda-toolkit/${{ matrix.cuda-version }}
